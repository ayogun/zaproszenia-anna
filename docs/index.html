<body data-music-file="music.mp3" data-messages="[{&quot;text&quot;:&quot;Są w życiu pytania, które zadaje się tylko raz…&quot;},{&quot;text&quot;:&quot;Niektóre osoby sprawiają, że najważniejsze chwile stają się jeszcze piękniejsze.&quot;},{&quot;text&quot;:&quot;I właśnie dlatego chciałabym zapytać o coś wyjątkowego…&quot;},{&quot;text&quot;:&quot;Ale zanim to zrobię, mam do Was kilka pytań…&quot;},{&quot;text&quot;:&quot;Czy wiesz, jak ważną osobą jesteś w moim życiu?&quot;},{&quot;text&quot;:&quot;Czy pamiętasz nasze najpiękniejsze wspólne chwile?&quot;},{&quot;text&quot;:&quot;Czy wyobrażasz sobie, że mogłoby Cię zabraknąć w jednym z najważniejszych dni mojego życia?&quot;},{&quot;text&quot;:&quot;Czy wiesz, że nie wyobrażam sobie tej chwili bez Ciebie?&quot;},{&quot;text&quot;:&quot;Czy jesteś gotowa na kolejne wspólne szaleństwa?&quot;},{&quot;text&quot;:&quot;Czy obiecujesz nie płakać bardziej niż ja?&quot;},{&quot;text&quot;:&quot;Czy jesteś gotowa na emocje, wzruszenia i odrobinę chaosu?&quot;},{&quot;text&quot;:&quot;Czy mogę liczyć na Twoją obecność, nawet jeśli będziesz musiała poprawiać mi makijaż?&quot;},{&quot;text&quot;:&quot;Mam nadzieję, że odpowiedź brzmi TAK…&quot;},{&quot;text&quot;:&quot;Bo jest jedna osoba, którą bardzo chciałabym mieć przy sobie…&quot;},{&quot;text&quot;:&quot;W dniu, który będzie dla mnie wyjątkowy.&quot;},{&quot;text&quot;:&quot;W dniu, który zapamiętam na całe życie…&quot;},{&quot;text&quot;:&quot;Czy zostaniesz moją druhną?&quot;,&quot;detail&quot;:&quot;Nie wyobrażam sobie tego dnia bez Ciebie.&quot;,&quot;final&quot;:true}]">
  <svg width="0" height="0" class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="corner" viewBox="0 0 28 28">
        <path d="M1.5 27V6.5Q1.5 1.5 6.5 1.5H27M6.5 27V11.5Q6.5 6.5 11.5 6.5H27" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="1.5" cy="1.5" r="1.7" fill="currentColor"/>
      </symbol>
      <symbol id="divider" viewBox="0 0 160 12">
        <path d="M0 6H66M94 6H160" fill="none" stroke="currentColor" stroke-width="1"/>
        <path d="M80 1L86 6L80 11L74 6Z" fill="currentColor"/>
        <circle cx="69" cy="6" r="1.3" fill="currentColor"/>
        <circle cx="91" cy="6" r="1.3" fill="currentColor"/>
      </symbol>
    </defs>
  </svg>

  <main>
    <section class="scene" id="scene" aria-label="Zaproszenie dla Ciebie">
      <div class="stage" id="stage">
        <img class="ambient ambient-left" src="rose-leaves.png" alt="" aria-hidden="true">
        <img class="ambient ambient-right" src="rose-leaves.png" alt="" aria-hidden="true">
        <div class="sheet" id="sheet">
          <div class="panel" id="p1">
            <div class="face front cover">
              <img class="flower flower-top" src="rose.png" alt="" aria-hidden="true">
              <img class="flower flower-bottom" src="rose.png" alt="" aria-hidden="true">
              <img class="leaves leaves-top" src="rose-leaves.png" alt="" aria-hidden="true">
              <svg class="corner tl" aria-hidden="true"><use href="#corner"/></svg>
              <svg class="corner tr" aria-hidden="true"><use href="#corner"/></svg>
              <svg class="corner bl" aria-hidden="true"><use href="#corner"/></svg>
              <svg class="corner br" aria-hidden="true"><use href="#corner"/></svg>
              <p class="eyebrow">Dla kogoś wyjątkowego</p>
              <h1 class="names foil">Dla Ciebie</h1>
              <svg class="divider" aria-hidden="true"><use href="#divider"/></svg>
              <p class="hero-date">Mała historia o wielkim pytaniu</p>
              <p class="hint" id="hint">Dotknij lub przesuń w lewo, aby otworzyć <span aria-hidden="true">←</span></p>
            </div>
          </div>
          <button class="card-action" id="card-action" type="button" aria-label="Otwórz zaproszenie"></button>
        </div>

        <template id="message-template">
          <div class="panel message-panel">
            <div class="face front message">
              <img class="flower flower-top" src="rose.png" alt="" aria-hidden="true">
              <img class="flower flower-bottom" src="rose.png" alt="" aria-hidden="true">
              <img class="leaves leaves-top" src="rose-leaves.png" alt="" aria-hidden="true">
              <p class="message-eyebrow">Kilka słów dla Ciebie</p>
              <h2 class="message-text"></h2>
              <p class="message-detail" hidden></p>
              <span class="message-heart" aria-hidden="true" hidden>❤</span>
            </div>
            <div class="face back" aria-hidden="true"><span class="monogram">♥</span></div>
          </div>
        </template>

        <nav class="story-controls" aria-label="Nawigacja po zaproszeniu">
          <button class="story-button previous" id="previous" type="button" aria-label="Poprzednia wiadomość" aria-disabled="true">
            <span aria-hidden="true">←</span><span class="previous-label">Wstecz</span>
          </button>
          <span class="counter" id="counter" aria-label="Postęp zaproszenia"></span>
          <button class="story-button next" id="next" type="button">
            <span id="next-label">Otwórz</span><span aria-hidden="true">→</span>
          </button>
        </nav>
        <p class="swipe-tip">Przesuń w lewo lub użyj strzałek</p>
      </div>
    </section>
    <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript>
      <section class="no-js">
        <p class="eyebrow">Dla kogoś wyjątkowego</p>
        <h1 class="names">Dla Ciebie</h1>
        <ol><li><p>Są w życiu pytania, które zadaje się tylko raz…</p></li><li><p>Niektóre osoby sprawiają, że najważniejsze chwile stają się jeszcze piękniejsze.</p></li><li><p>I właśnie dlatego chciałabym zapytać o coś wyjątkowego…</p></li><li><p>Ale zanim to zrobię, mam do Was kilka pytań…</p></li><li><p>Czy wiesz, jak ważną osobą jesteś w moim życiu?</p></li><li><p>Czy pamiętasz nasze najpiękniejsze wspólne chwile?</p></li><li><p>Czy wyobrażasz sobie, że mogłoby Cię zabraknąć w jednym z najważniejszych dni mojego życia?</p></li><li><p>Czy wiesz, że nie wyobrażam sobie tej chwili bez Ciebie?</p></li><li><p>Czy jesteś gotowa na kolejne wspólne szaleństwa?</p></li><li><p>Czy obiecujesz nie płakać bardziej niż ja?</p></li><li><p>Czy jesteś gotowa na emocje, wzruszenia i odrobinę chaosu?</p></li><li><p>Czy mogę liczyć na Twoją obecność, nawet jeśli będziesz musiała poprawiać mi makijaż?</p></li><li><p>Mam nadzieję, że odpowiedź brzmi TAK…</p></li><li><p>Bo jest jedna osoba, którą bardzo chciałabym mieć przy sobie…</p></li><li><p>W dniu, który będzie dla mnie wyjątkowy.</p></li><li><p>W dniu, który zapamiętam na całe życie…</p></li><li><p>Czy zostaniesz moją druhną?</p><p><em>Nie wyobrażam sobie tego dnia bez Ciebie.</em> ❤</p></li></ol>
      </section>
    </noscript>
  </main>

  <button id="music" class="music" type="button" aria-pressed="false" hidden>
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    <span id="music-label">Włącz muzykę</span>
  </button>

</html>
